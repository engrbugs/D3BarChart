<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDP Bar Chart · D3 Gallery</title><link rel="stylesheet" href="../gallery.css"><script src="https://cdn.jsdelivr.net/npm/d3@7"></script></head><body><main class="page"><header class="topbar"><a class="brand" href="../">D3 <span>Gallery</span></a><nav><a href="../bar-chart/">Bar</a><a href="../scatter-plot/">Scatter</a><a href="../heat-map/">Heat</a><a href="../tree-map/">Tree</a><a href="../choropleth-map/">Map</a></nav></header><div class="eyebrow">Data story · 1950—2015</div><h1>US GDP, year by year.</h1><p class="lede">A clean view of long-term economic growth, with hover details for every year in the series.</p><section class="card"><div class="card-head"><div><h2>United States GDP</h2><p>Gross domestic product in billions of US dollars</p></div><div class="badge">INTERACTIVE</div></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1100 560" role="img" aria-label="Bar chart showing US GDP from 1950 to 2015"></svg></div></section><div class="footer"><span>Built with D3.js</span><a href="https://github.com/engrbugs/D3BarChart">View source on GitHub →</a></div></main><div id="tooltip" class="tooltip"></div><script>
const svg=d3.select('#chart'),tip=d3.select('#tooltip'),W=1100,H=560,m={t:34,r:28,b:62,l:78},iw=W-m.l-m.r,ih=H-m.t-m.b; const x=d3.scaleBand().range([m.l,W-m.r]).padding(.12),y=d3.scaleLinear().range([H-m.b,m.t]); const fmt=d3.format(',.0f');
function draw(data){x.domain(data.map(d=>d[0]));y.domain([0,d3.max(data,d=>d[1])]).nice();svg.append('defs').append('linearGradient').attr('id','barGradient').attr('x1','0').attr('y1','0').attr('x2','0').attr('y2','1').selectAll('stop').data([{o:'0%',c:'#67e8f9'},{o:'100%',c:'#6366f1'}]).enter().append('stop').attr('offset',d=>d.o).attr('stop-color',d=>d.c);svg.append('g').attr('class','grid').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(x.domain().filter((_,i)=>i%8===0)).tickSize(-ih).tickFormat(''));svg.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat(d=>'$'+fmt(d)));svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(x.domain().filter((_,i)=>i%8===0)));svg.selectAll('.bar').data(data).enter().append('rect').attr('class','bar').attr('x',d=>x(d[0])).attr('y',d=>y(d[1])).attr('width',x.bandwidth()).attr('height',d=>H-m.b-y(d[1])).on('pointermove',(e,d)=>{tip.html(`<strong>${d[0]}</strong><br>$${fmt(d[1])}B`).classed('show',true).style('left',e.clientX+'px').style('top',e.clientY+'px')}).on('pointerleave',()=>tip.classed('show',false));svg.append('text').attr('class','label').attr('x',W/2).attr('y',H-16).attr('text-anchor','middle').text('Year');svg.append('text').attr('class','label').attr('transform','rotate(-90)').attr('x',-H/2).attr('y',18).attr('text-anchor','middle').text('GDP (billions)')}
fetch('https://raw.githubusercontent.com/freeCodeCamp/ProjectReferenceData/master/GDP-data.json').then(r=>r.json()).then(d=>draw(d.data.map(x=>[x[0].slice(0,4),x[1]]))).catch(()=>draw([['1950',300],['1960',543],['1970',1076],['1980',2857],['1990',5979],['2000',10252],['2010',14964],['2015',18206]]));</script></body></html>
