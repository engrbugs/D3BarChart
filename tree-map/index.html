<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treemap · D3 Gallery</title><link rel="stylesheet" href="../gallery.css"><script src="https://cdn.jsdelivr.net/npm/d3@7"></script></head><body><main class="page"><header class="topbar"><a class="brand" href="../">D3 <span>Gallery</span></a><nav><a href="../bar-chart/">Bar</a><a href="../scatter-plot/">Scatter</a><a href="../heat-map/">Heat</a><a href="../tree-map/">Tree</a><a href="../choropleth-map/">Map</a></nav></header><div class="eyebrow">Entertainment · top 100</div><h1>Where movie money goes.</h1><p class="lede">A treemap of the highest-grossing films, grouped by genre and sized by worldwide sales.</p><section class="card"><div class="card-head"><div><h2>Top 100 highest-grossing movies</h2><p>Tile size represents gross revenue</p></div><div class="badge">HOVER TO INSPECT</div></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 1100 620"></svg></div></section><div class="footer"><span>Built with D3.js</span><a href="https://github.com/engrbugs/D3BarChart">View source on GitHub →</a></div></main><div id="tooltip" class="tooltip"></div><script>
const svg=d3.select('#chart'),tip=d3.select('#tooltip'),W=1100,H=620,color=d3.scaleOrdinal(d3.schemeTableau10);fetch('https://cdn.freecodecamp.org/testable-projects-fcc/data/tree_map/movie-data.json').then(r=>r.json()).then(data=>{const root=d3.treemap().size([W,H]).paddingInner(2).round(true)(d3.hierarchy(data).sum(d=>d.value).sort((a,b)=>b.value-a.value));const cells=svg.selectAll('g').data(root.leaves()).enter().append('g').attr('transform',d=>`translate(${d.x0},${d.y0})`);cells.append('rect').attr('class','tile').attr('width',d=>d.x1-d.x0).attr('height',d=>d.y1-d.y0).attr('fill',d=>color(d.data.category)).on('pointermove',(e,d)=>{tip.html(`<strong>${d.data.name}</strong><br>${d.data.category}<br>$${d3.format(',.0f')(d.data.value)} worldwide`).classed('show',true).style('left',e.clientX+'px').style('top',e.clientY+'px')}).on('pointerleave',()=>tip.classed('show',false));cells.filter(d=>d.x1-d.x0>55).append('text').attr('x',6).attr('y',16).attr('fill','#fff').attr('font-size','11').text(d=>d.data.name.slice(0,22))});</script></body></html>
